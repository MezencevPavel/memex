{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="mb-0">{% if phone %}Редактировать контакт{% else %}Новый контакт{% endif %}</h1>
    <a href="{{ url_for('phones') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> К списку</a>
</div>

<form method="POST">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Тема</label>
            <input type="text" name="topic" class="form-control"
                   value="{{ phone.topic if phone else '' }}"
                   list="topics-list" placeholder="Работа, Личное...">
            <datalist id="topics-list">
                {% for t in topics %}<option value="{{ t }}">{% endfor %}
            </datalist>
        </div>
        <div class="col-md-4">
            <label class="form-label">Имя / Кому</label>
            <input type="text" name="name" class="form-control"
                   value="{{ phone.name if phone else '' }}"
                   placeholder="Например: СБИС техподдержка" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Номер</label>
            <input type="text" name="number" class="form-control"
                   value="{{ phone.number if phone else '' }}"
                   placeholder="+7 495 123-45-67" required
                   style="font-family: 'Consolas', 'Monaco', monospace;">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Описание <span class="text-muted small">(необязательно)</span></label>
        <textarea name="description" class="form-control" rows="3"
                  placeholder="Когда звонить, что говорить">{{ phone.description if phone else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Сохранить</button>
    <a href="{{ url_for('phones') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
