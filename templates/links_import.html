{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0"><i class="bi bi-upload"></i> Импорт ссылок</h1>
    <a href="{{ url_for('links') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
</div>

<form method="POST" enctype="multipart/form-data">
    <div class="row g-3 mb-3">
        <div class="col-md-6">
            <label class="form-label">Файл</label>
            <input type="file" name="file" class="form-control" accept=".json,.md,.csv,.txt">
            <div class="form-text">Поддерживаются .json, .md, .csv, .txt</div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Тема по умолчанию</label>
            <input type="text" name="default_topic" class="form-control" list="topics-list" value="Общее">
            <datalist id="topics-list">
                {% for t in topics %}<option value="{{ t }}">{% endfor %}
            </datalist>
            <div class="form-text">Если у ссылки не указана своя тема.</div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Или вставь текст</label>
        <textarea name="json_data" class="form-control" rows="15"
                  placeholder='[{"topic": "Python", "title": "...", "url": "https://...", "description": "..."}]'
                  style="font-family: 'Consolas', 'Monaco', monospace; font-size: .9rem;"></textarea>
        <div class="form-text">Если файл выбран — текст игнорируется.</div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload"></i> Импортировать</button>
    <a href="{{ url_for('links') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
