{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h1 class="mb-0">{% if snippet %}Редактировать сниппет{% else %}Новый сниппет{% endif %}</h1>
    <a href="{{ url_for('snippets') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> К списку</a>
</div>

<form method="POST">
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label">Тема</label>
            <input type="text" name="topic" class="form-control"
                   value="{{ snippet.topic if snippet else '' }}"
                   list="topics-list" placeholder="PowerShell, Python...">
            <datalist id="topics-list">
                {% for t in topics %}<option value="{{ t }}">{% endfor %}
            </datalist>
        </div>
        <div class="col-md-8">
            <label class="form-label">Название</label>
            <input type="text" name="name" class="form-control"
                   value="{{ snippet.name if snippet else '' }}"
                   placeholder="Например: Сброс сетевых настроек" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Команда</label>
        <textarea name="command" class="form-control" rows="6"
                  placeholder="ipconfig /release"
                  style="font-family: 'Consolas', 'Monaco', monospace; font-size: .9rem;" required>{{ snippet.command if snippet else '' }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Описание <span class="text-muted small">(необязательно)</span></label>
        <textarea name="description" class="form-control" rows="3"
                  placeholder="Короткое пояснение">{{ snippet.description if snippet else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Сохранить</button>
    <a href="{{ url_for('snippets') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
