{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0"><i class="bi bi-upload"></i> Импорт категорий</h1>
    <a href="{{ url_for('categories') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
</div>

<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label class="form-label">Файл (JSON)</label>
        <input type="file" name="file" class="form-control" accept=".json,.txt">
        <div class="form-text">Формат: <code>[{"name": "Работа", "children": [{"name": "Linux"}]}]</code></div>
    </div>

    <div class="mb-3">
        <label class="form-label">Или вставь JSON</label>
        <textarea name="json_data" class="form-control" rows="15"
                  placeholder='[{"name": "Работа", "children": [{"name": "Linux"}]}]'
                  style="font-family: 'Consolas', 'Monaco', monospace; font-size: .9rem;"></textarea>
        <div class="form-text">Если файл выбран — текст игнорируется.</div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload"></i> Импортировать</button>
    <a href="{{ url_for('categories') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
